<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#12262B" />
<title>Mi Libreta</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12262B; --bg-deep:#0C1C20; --paper:#F2EFE7; --paper-dim:#8FA0A0;
    --ink:#0F2027; --gold:#D4A54A; --green:#4C9A6D; --red:#C1503D; --blue:#5B8FB0;
    --card:#173339; --line:#25464C;
    --font-display:'Fraunces',Georgia,serif; --font-body:'IBM Plex Sans',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background: var(--bg-deep); }
  body {
    font-family: var(--font-body);
    background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 100%);
    min-height: 100vh; min-height: 100dvh;
    color: var(--paper);
  }
  #app { max-width: 480px; margin: 0 auto; position: relative; padding-bottom: 100px; min-height: 100vh; }
  input, select, textarea, button { font-family: var(--font-body); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  ::-webkit-scrollbar { display: none; }
  button { cursor: pointer; }

  header { padding: 24px 20px 14px; padding-top: max(24px, env(safe-area-inset-top)); display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--line); }
  .eyebrow { margin:0; font-size:11px; letter-spacing:.14em; color: var(--gold); font-family: var(--font-mono); }
  h1 { margin:4px 0 0; font-family: var(--font-display); font-size:24px; font-weight:600; color: var(--paper); }
  .stamp { display:flex; flex-direction:column; align-items:flex-end; border:1.5px solid var(--gold); border-radius:10px; padding:6px 12px; transform: rotate(-2deg); }
  .stamp-label { font-family: var(--font-mono); font-size:9px; letter-spacing:.12em; color: var(--gold); }
  .stamp-amount { font-family: var(--font-mono); font-size:15px; font-weight:600; }

  main { padding: 14px 20px 20px; }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; align-items:center; }
  .search-input { flex:1; background: var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color: var(--paper); font-size:14px; }
  .icon-btn { background: var(--card); border:1px solid var(--line); border-radius:10px; width:38px; height:38px; min-width:38px; display:flex; align-items:center; justify-content:center; color: var(--paper); font-size:16px; }
  .icon-btn.active { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .summary { color: var(--paper-dim); font-size:13px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
  .summary .mono { font-family: var(--font-mono); }
  .summary-share { background:none; border:1px solid var(--line); color: var(--paper-dim); border-radius:8px; padding:5px 10px; font-size:11px; font-family: var(--font-mono); display:flex; align-items:center; gap:4px; }

  ul.list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .card { display:flex; align-items:flex-start; gap:12px; background: var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card.done { opacity:.5; }
  .checkbox { width:22px; height:22px; min-width:22px; border-radius:6px; border:1.5px solid var(--gold); display:flex; align-items:center; justify-content:center; background:transparent; margin-top:2px; padding:0; }
  .checkbox.checked { background: var(--green); }
  .card-body { flex:1; min-width:0; }
  .card-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .card-title { color: var(--paper); font-size:15px; font-weight:500; }
  .card-title.strike { text-decoration: line-through; }
  .card-amount { color: var(--paper); font-family: var(--font-mono); font-size:14px; white-space:nowrap; }
  .card-sub { font-size:12px; color: var(--paper-dim); font-family: var(--font-mono); margin-top:2px; }
  .card-meta { display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .pill { font-size:10px; font-family: var(--font-mono); border:1px solid; border-radius:20px; padding:2px 8px; display:inline-flex; align-items:center; gap:3px; }
  .notes { font-size:12px; color: var(--paper-dim); font-style: italic; }
  .card-actions { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .delete-btn { background:none; border:none; padding:4px; margin-top:2px; color: var(--paper-dim); }
  .select-check { width:20px; height:20px; min-width:20px; border-radius:5px; border:1.5px solid var(--paper-dim); display:flex; align-items:center; justify-content:center; background:transparent; padding:0; margin-top:2px; font-size:12px; }
  .select-check.checked { background: var(--gold); border-color: var(--gold); color: var(--ink); }

  .empty { text-align:center; padding:48px 20px; }
  .empty-icon { width:56px; height:56px; border-radius:50%; border:1.5px dashed var(--gold); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:22px; }
  .empty-title { color: var(--paper); font-family: var(--font-display); font-size:18px; margin:0 0 4px; }
  .empty-text { color: var(--paper-dim); font-size:13px; margin:0; }

  .fab { position:fixed; bottom: calc(88px + env(safe-area-inset-bottom)); right:20px; width:54px; height:54px; border-radius:50%; background: var(--gold); border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(0,0,0,.35); font-size:26px; color: var(--ink); z-index:15; }

  .share-bar { position:fixed; bottom: calc(88px + env(safe-area-inset-bottom) + 10px); left:50%; transform:translateX(-50%); width:calc(100% - 40px); max-width:440px; background:#25D366; color:#0a3d24; border-radius:14px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 6px 16px rgba(0,0,0,.35); z-index:20; border:none; font-weight:600; }
  .share-bar span { font-size:13px; }
  .share-bar-btns { display:flex; align-items:center; gap:6px; }
  .share-bar button.go { background:#0a3d24; color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .share-cancel { background:none !important; color:#0a3d24 !important; padding:6px !important; font-size:18px; border:none; }

  nav.tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; display:flex; background: var(--bg-deep); border-top:1px solid var(--line); padding:10px 20px calc(18px + env(safe-area-inset-bottom)); }
  .tab-btn { flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; position:relative; color: var(--paper-dim); font-size:20px; }
  .tab-btn.active { color: var(--gold); }
  .tab-label { font-size:11px; font-family: var(--font-mono); }
  .tab-dot { position:absolute; top:-10px; width:4px; height:4px; border-radius:50%; background: var(--gold); }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; z-index:50; }
  .sheet { width:100%; max-width:480px; margin:0 auto; background: var(--bg); border-radius:20px 20px 0 0; padding:10px 20px calc(28px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; border-top:1px solid var(--line); }
  .sheet-handle { width:36px; height:4px; border-radius:2px; background: var(--line); margin:6px auto 14px; }
  .sheet-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .sheet-title { color: var(--paper); font-family: var(--font-display); font-size:20px; margin:0; }
  .close-btn { background:none; border:none; padding:4px; color: var(--paper); font-size:20px; }
  .form { display:flex; flex-direction:column; gap:14px; }
  .form-row { display:flex; gap:10px; }
  .form-row .field { flex:1; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field-label { font-size:12px; color: var(--paper-dim); font-family: var(--font-mono); }
  .input, textarea.input { background: var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; color: var(--paper); font-size:15px; width:100%; resize:none; }
  .segmented { display:flex; gap:8px; }
  .segment-btn { flex:1; padding:10px 8px; border-radius:8px; border:1px solid var(--line); font-size:13px; background:transparent; color: var(--paper); }
  .segment-btn.active-prestado { background: var(--green); color: var(--ink); }
  .segment-btn.active-recibido { background: var(--red); color: var(--ink); }
  .save-btn { width:100%; margin-top:22px; padding:14px; border-radius:12px; border:none; background: var(--gold); color: var(--ink); font-weight:600; font-size:15px; }
  .save-btn:disabled { opacity:.4; }
  .error-banner { margin:12px 20px 0; padding:10px 14px; background:rgba(193,80,61,.15); border:1px solid var(--red); border-radius:8px; color: var(--red); font-size:13px; }
  .toast { position:fixed; top: max(16px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%); background: var(--card); border:1px solid var(--gold); color: var(--paper); padding:10px 16px; border-radius:10px; font-size:13px; z-index:60; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- Almacenamiento local (en este teléfono) ----------
const DB_KEY = "libreta_data_v2";
function loadData() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) return JSON.parse(raw);
    // migración desde versión anterior si existe
    const old = localStorage.getItem("libreta_data_v1");
    if (old) {
      const o = JSON.parse(old);
      return {
        productos: (o.productos || []).map(p => ({
          id: p.id, nombre: p.nombre, cantidad: 1, precio: p.precio,
          descripcion: p.notas || "", comprado: !!p.comprado
        })),
        prestamos: o.prestamos || []
      };
    }
    return { productos: [], prestamos: [] };
  } catch (e) {
    return { productos: [], prestamos: [] };
  }
}
function saveData(data) {
  try { localStorage.setItem(DB_KEY, JSON.stringify(data)); }
  catch (e) { showError("No se pudo guardar. Espacio lleno o navegador privado."); }
}

let state = loadData();
let currentTab = "productos";
let errorMsg = "";
let selectedIds = new Set();
let searchQuery = "";
let showSearch = false;

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function fmt(n) { return new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: 2 }).format(Number(n) || 0); }
function showError(msg) { errorMsg = msg; render(); setTimeout(() => { errorMsg = ""; render(); }, 4000); }
function showToast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.innerText = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function escapeHtml(s) { const d = document.createElement("div"); d.innerText = s || ""; return d.innerHTML; }

function diasDesde(fechaStr) {
  if (!fechaStr) return "";
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const f = new Date(fechaStr + "T00:00:00");
  const diff = Math.round((hoy - f) / 86400000);
  if (diff === 0) return "hoy";
  if (diff === 1) return "hace 1 día";
  if (diff > 1) return `hace ${diff} días`;
  if (diff === -1) return "mañana";
  return `en ${Math.abs(diff)} días`;
}

function render() {
  let productos = state.productos;
  let prestamos = state.prestamos;

  if (currentTab === "productos" && searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    productos = productos.filter(p =>
      (p.nombre || "").toLowerCase().includes(q) || (p.descripcion || "").toLowerCase().includes(q)
    );
  }

  const totalWishlist = state.productos.reduce((s, p) => p.comprado ? s : s + Number(p.precio || 0) * Number(p.cantidad || 1), 0);
  const meDeben = state.prestamos.filter(p => p.tipo === "prestado" && !p.pagado).reduce((s, p) => s + Number(p.monto || 0), 0);
  const debo = state.prestamos.filter(p => p.tipo === "recibido" && !p.pagado).reduce((s, p) => s + Number(p.monto || 0), 0);
  const saldo = meDeben - debo;

  let listHtml = "";
  if (currentTab === "productos") {
    if (productos.length === 0) {
      listHtml = state.productos.length === 0
        ? emptyState("🛍️", "Sin productos", "Anota lo que quieres comprar: nombre, cantidad, precio y descripción.")
        : emptyState("🔍", "Sin resultados", "No hay productos que coincidan con tu búsqueda.");
    } else {
      const sorted = [...productos].sort((a, b) => Number(a.comprado) - Number(b.comprado));
      listHtml = `<ul class="list">${sorted.map(productoCard).join("")}</ul>`;
    }
  } else {
    if (prestamos.length === 0) {
      listHtml = emptyState("🤝", "Sin préstamos ni fiados", "Registra dinero o cosas fiadas, con quién y cuándo.");
    } else {
      const sorted = [...prestamos].sort((a, b) => {
        if (Number(a.pagado) !== Number(b.pagado)) return Number(a.pagado) - Number(b.pagado);
        return (b.fecha || "").localeCompare(a.fecha || "");
      });
      listHtml = `<ul class="list">${sorted.map(prestamoCard).join("")}</ul>`;
    }
  }

  const summaryLeft = currentTab === "productos"
    ? `${state.productos.filter(p => !p.comprado).length} pendientes · <span class="mono">${fmt(totalWishlist)}</span>`
    : `<span class="mono" style="color:var(--green)">${fmt(meDeben)}</span> me deben · <span class="mono" style="color:var(--red)">${fmt(debo)}</span> debo`;

  const toolbarHtml = currentTab === "productos" ? `
    <div class="toolbar">
      ${showSearch ? `<input class="search-input" id="search-input" placeholder="Buscar producto..." value="${escapeHtml(searchQuery)}" oninput="onSearch(this.value)" autofocus />` : `<div style="flex:1"></div>`}
      <button class="icon-btn ${showSearch ? 'active' : ''}" onclick="toggleSearch()" aria-label="Buscar">🔍</button>
      <button class="icon-btn" onclick="shareAll()" aria-label="Compartir toda la lista">📤</button>
    </div>` : "";

  document.getElementById("app").innerHTML = `
    <header>
      <div>
        <p class="eyebrow">MI LIBRETA</p>
        <h1>Cuentas claras</h1>
      </div>
      <div class="stamp">
        <span class="stamp-label">SALDO</span>
        <span class="stamp-amount" style="color:${saldo >= 0 ? 'var(--green)' : 'var(--red)'}">${saldo >= 0 ? '+' : ''}${fmt(saldo)}</span>
      </div>
    </header>
    ${errorMsg ? `<div class="error-banner">${errorMsg}</div>` : ""}
    <main>
      ${toolbarHtml}
      <div class="summary"><span>${summaryLeft}</span></div>
      ${listHtml}
    </main>
    <button class="fab" onclick="openForm()" aria-label="Agregar">+</button>
    ${currentTab === 'productos' && selectedIds.size > 0 ? `
    <div class="share-bar">
      <span>${selectedIds.size} seleccionado${selectedIds.size > 1 ? 's' : ''}</span>
      <div class="share-bar-btns">
        <button class="share-cancel" onclick="clearSelection()" aria-label="Cancelar selección">✕</button>
        <button class="go" onclick="shareSelected()">📤 Compartir</button>
      </div>
    </div>` : ""}
    <nav class="tabbar">
      <button class="tab-btn ${currentTab === 'productos' ? 'active' : ''}" onclick="setTab('productos')">
        🛍️<span class="tab-label">Productos</span>${currentTab === 'productos' ? '<span class="tab-dot"></span>' : ''}
      </button>
      <button class="tab-btn ${currentTab === 'prestamos' ? 'active' : ''}" onclick="setTab('prestamos')">
        🤝<span class="tab-label">Préstamos</span>${currentTab === 'prestamos' ? '<span class="tab-dot"></span>' : ''}
      </button>
    </nav>
    <div id="sheet-container"></div>
  `;
  const si = document.getElementById("search-input");
  if (si) { si.focus(); si.selectionStart = si.selectionEnd = si.value.length; }
}

function emptyState(icon, title, text) {
  return `<div class="empty"><div class="empty-icon">${icon}</div><p class="empty-title">${title}</p><p class="empty-text">${text}</p></div>`;
}

function productoCard(p) {
  const isSelected = selectedIds.has(p.id);
  const cantidad = Number(p.cantidad || 1);
  const subtotal = Number(p.precio || 0) * cantidad;
  return `
    <li class="card ${p.comprado ? 'done' : ''}">
      <button class="checkbox ${p.comprado ? 'checked' : ''}" onclick="toggleProducto('${p.id}')" aria-label="Marcar comprado">
        ${p.comprado ? '✓' : ''}
      </button>
      <div class="card-body">
        <div class="card-top">
          <span class="card-title ${p.comprado ? 'strike' : ''}">${escapeHtml(p.nombre)}</span>
          <span class="card-amount">${fmt(subtotal)}</span>
        </div>
        <div class="card-sub">${cantidad} × ${fmt(p.precio)}</div>
        <div class="card-meta">
          ${p.descripcion ? `<span class="notes">${escapeHtml(p.descripcion)}</span>` : ""}
        </div>
      </div>
      <div class="card-actions">
        <button class="select-check ${isSelected ? 'checked' : ''}" onclick="toggleSelect('${p.id}')" aria-label="Seleccionar para compartir">
          ${isSelected ? '✓' : ''}
        </button>
        <button class="delete-btn" onclick="deleteProducto('${p.id}')" aria-label="Eliminar">🗑</button>
      </div>
    </li>`;
}

function prestamoCard(p) {
  const esMeDeben = p.tipo === "prestado";
  const color = esMeDeben ? "var(--green)" : "var(--red)";
  return `
    <li class="card ${p.pagado ? 'done' : ''}">
      <button class="checkbox ${p.pagado ? 'checked' : ''}" onclick="togglePrestamo('${p.id}')" aria-label="Marcar pagado">
        ${p.pagado ? '✓' : ''}
      </button>
      <div class="card-body">
        <div class="card-top">
          <span class="card-title ${p.pagado ? 'strike' : ''}">${escapeHtml(p.persona)}</span>
          <span class="card-amount" style="color:${color}">${esMeDeben ? '+' : '−'}${fmt(p.monto)}</span>
        </div>
        <div class="card-meta">
          <span class="pill" style="border-color:${color}; color:${color}">${esMeDeben ? '↙ Me debe' : '↗ Le debo'}</span>
          ${p.fecha ? `<span class="pill" style="border-color:var(--blue); color:var(--blue)">📅 ${p.fecha} · ${diasDesde(p.fecha)}</span>` : ""}
        </div>
        ${p.descripcion ? `<div class="card-meta"><span class="notes">${escapeHtml(p.descripcion)}</span></div>` : ""}
      </div>
      <button class="delete-btn" onclick="deletePrestamo('${p.id}')" aria-label="Eliminar">🗑</button>
    </li>`;
}

function setTab(tab) { currentTab = tab; selectedIds.clear(); showSearch = false; searchQuery = ""; render(); }
function toggleSearch() { showSearch = !showSearch; if (!showSearch) searchQuery = ""; render(); }
function onSearch(v) { searchQuery = v; render(); }

function toggleProducto(id) {
  state.productos = state.productos.map(p => p.id === id ? { ...p, comprado: !p.comprado } : p);
  saveData(state); render();
}
function deleteProducto(id) {
  selectedIds.delete(id);
  state.productos = state.productos.filter(p => p.id !== id);
  saveData(state); render();
}
function togglePrestamo(id) {
  state.prestamos = state.prestamos.map(p => p.id === id ? { ...p, pagado: !p.pagado } : p);
  saveData(state); render();
}
function deletePrestamo(id) {
  state.prestamos = state.prestamos.filter(p => p.id !== id);
  saveData(state); render();
}

function toggleSelect(id) {
  if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  render();
}
function clearSelection() { selectedIds.clear(); render(); }

function buildListText(items) {
  let total = 0;
  const lines = items.map(p => {
    const cantidad = Number(p.cantidad || 1);
    const subtotal = Number(p.precio || 0) * cantidad;
    total += subtotal;
    let line = `• ${p.nombre} (x${cantidad}) - ${fmt(subtotal)}`;
    if (p.descripcion) line += `\n   ${p.descripcion}`;
    return line;
  });
  return `🛍️ Mi lista de compras:\n\n${lines.join("\n")}\n\nTotal: ${fmt(total)}`;
}

function shareSelected() {
  const items = state.productos.filter(p => selectedIds.has(p.id));
  if (items.length === 0) return;
  const text = buildListText(items);
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}

function shareAll() {
  const items = state.productos.filter(p => !p.comprado);
  if (items.length === 0) { showToast("No hay productos pendientes para compartir"); return; }
  const text = buildListText(items);
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}

// ---------- Formulario ----------
let formTipo = "prestado";

function openForm() {
  formTipo = "prestado";
  const isProductos = currentTab === "productos";
  const today = new Date().toISOString().slice(0, 10);

  const productoForm = `
    <div class="field"><span class="field-label">Nombre del producto</span>
      <input class="input" id="f-nombre" placeholder="Ej. Audífonos" /></div>
    <div class="form-row">
      <div class="field"><span class="field-label">Cantidad</span>
        <input class="input" id="f-cantidad" type="number" inputmode="numeric" min="1" value="1" /></div>
      <div class="field"><span class="field-label">Precio unitario</span>
        <input class="input" id="f-precio" type="number" inputmode="decimal" placeholder="0.00" /></div>
    </div>
    <div class="field"><span class="field-label">Descripción (opcional)</span>
      <textarea class="input" id="f-descripcion" rows="2" placeholder="Ej. Color negro, talla M, comprar en oferta..."></textarea></div>
  `;

  const prestamoForm = `
    <div class="field"><span class="field-label">Tipo</span>
      <div class="segmented" id="f-tipo-group">
        <button type="button" class="segment-btn active-prestado" data-id="prestado" onclick="selectTipo('prestado')">Yo presté / fié</button>
        <button type="button" class="segment-btn" data-id="recibido" onclick="selectTipo('recibido')">Me prestaron / fiaron</button>
      </div></div>
    <div class="field"><span class="field-label" id="f-persona-label">¿A quién?</span>
      <input class="input" id="f-persona" placeholder="Nombre" /></div>
    <div class="form-row">
      <div class="field"><span class="field-label">Monto</span>
        <input class="input" id="f-monto" type="number" inputmode="decimal" placeholder="0.00" /></div>
      <div class="field"><span class="field-label">Fecha</span>
        <input class="input" id="f-fecha" type="date" value="${today}" /></div>
    </div>
    <div class="field"><span class="field-label">Descripción (opcional)</span>
      <textarea class="input" id="f-descripcion" rows="2" placeholder="Ej. Para gasolina, motivo del préstamo..."></textarea></div>
  `;

  document.getElementById("sheet-container").innerHTML = `
    <div class="overlay" onclick="closeForm(event)">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h2 class="sheet-title">${isProductos ? "Nuevo producto" : "Nuevo préstamo / fiado"}</h2>
          <button class="close-btn" onclick="closeForm()">✕</button>
        </div>
        <div class="form">${isProductos ? productoForm : prestamoForm}</div>
        <button class="save-btn" id="f-save" onclick="saveForm()">Guardar</button>
      </div>
    </div>
  `;
}

function selectTipo(id) {
  formTipo = id;
  document.querySelectorAll("#f-tipo-group .segment-btn").forEach(b => {
    b.className = "segment-btn" + (b.dataset.id === id ? " active-" + id : "");
  });
  document.getElementById("f-persona-label").innerText = id === "prestado" ? "¿A quién?" : "¿Quién te prestó/fió?";
}

function closeForm(e) { if (e) e.stopPropagation(); document.getElementById("sheet-container").innerHTML = ""; }

function saveForm() {
  if (currentTab === "productos") {
    const nombre = document.getElementById("f-nombre").value.trim();
    const cantidad = document.getElementById("f-cantidad").value || "1";
    const precio = document.getElementById("f-precio").value;
    const descripcion = document.getElementById("f-descripcion").value.trim();
    if (!nombre || !precio) return;
    state.productos.push({ id: uid(), nombre, cantidad: Number(cantidad), precio: Number(precio), descripcion, comprado: false });
  } else {
    const persona = document.getElementById("f-persona").value.trim();
    const monto = document.getElementById("f-monto").value;
    const fecha = document.getElementById("f-fecha").value;
    const descripcion = document.getElementById("f-descripcion").value.trim();
    if (!persona || !monto) return;
    state.prestamos.push({ id: uid(), persona, monto: Number(monto), tipo: formTipo, fecha, descripcion, pagado: false });
  }
  saveData(state);
  closeForm();
  render();
}

render();

// ---------- Registro del service worker ----------
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>

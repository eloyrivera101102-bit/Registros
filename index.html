<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#12262B" />
<title>Mi Libreta</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12262B; --bg-deep:#0C1C20; --paper:#F2EFE7; --paper-dim:#8FA0A0;
    --ink:#0F2027; --gold:#D4A54A; --green:#4C9A6D; --red:#C1503D; --blue:#5B8FB0;
    --card:#173339; --line:#25464C;
    --font-display:'Fraunces',Georgia,serif; --font-body:'IBM Plex Sans',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background: var(--bg-deep); }
  body {
    font-family: var(--font-body);
    background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 100%);
    min-height: 100vh; min-height: 100dvh;
    color: var(--paper);
  }
  #app { max-width: 480px; margin: 0 auto; position: relative; padding-bottom: 100px; min-height: 100vh; }
  input, select, textarea, button { font-family: var(--font-body); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  ::-webkit-scrollbar { display: none; }
  button { cursor: pointer; }

  header { padding: 24px 20px 14px; padding-top: max(24px, env(safe-area-inset-top)); display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--line); gap:10px; }
  .header-title-btn { background:none; border:none; text-align:left; padding:0; color:inherit; }
  .eyebrow { margin:0; font-size:11px; letter-spacing:.14em; color: var(--gold); font-family: var(--font-mono); display:flex; align-items:center; gap:4px; }
  h1 { margin:4px 0 0; font-family: var(--font-display); font-size:24px; font-weight:600; color: var(--paper); }
  .header-right { display:flex; align-items:flex-start; gap:8px; }
  .gear-btn { background: var(--card); border:1px solid var(--line); border-radius:10px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .stamp { display:flex; flex-direction:column; align-items:flex-end; border:1.5px solid var(--gold); border-radius:10px; padding:6px 12px; transform: rotate(-2deg); }
  .stamp-label { font-family: var(--font-mono); font-size:9px; letter-spacing:.12em; color: var(--gold); }
  .stamp-amount { font-family: var(--font-mono); font-size:15px; font-weight:600; }

  main { padding: 14px 20px 20px; }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; align-items:center; }
  .search-input { flex:1; background: var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color: var(--paper); font-size:14px; }
  .icon-btn { background: var(--card); border:1px solid var(--line); border-radius:10px; width:38px; height:38px; min-width:38px; display:flex; align-items:center; justify-content:center; color: var(--paper); font-size:16px; }
  .icon-btn.active { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .summary { color: var(--paper-dim); font-size:13px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
  .summary .mono { font-family: var(--font-mono); }

  .chip-row { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px; }
  .chip { white-space:nowrap; background:var(--card); border:1px solid var(--line); color:var(--paper-dim); border-radius:20px; padding:6px 12px; font-size:12px; font-family:var(--font-mono); }
  .chip.active { background:var(--gold); color:var(--ink); border-color:var(--gold); }

  ul.list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .card { display:flex; align-items:flex-start; gap:12px; background: var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card.done { opacity:.5; }
  .card.vencido { border-color: var(--red); box-shadow: 0 0 0 1px var(--red) inset; }
  .checkbox { width:22px; height:22px; min-width:22px; border-radius:6px; border:1.5px solid var(--gold); display:flex; align-items:center; justify-content:center; background:transparent; margin-top:2px; padding:0; }
  .checkbox.checked { background: var(--green); }
  .card-body { flex:1; min-width:0; }
  .card-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .card-title { color: var(--paper); font-size:15px; font-weight:500; }
  .card-title.strike { text-decoration: line-through; }
  .card-amount { color: var(--paper); font-family: var(--font-mono); font-size:14px; white-space:nowrap; }
  .card-sub { font-size:12px; color: var(--paper-dim); font-family: var(--font-mono); margin-top:2px; }
  .card-meta { display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .pill { font-size:10px; font-family: var(--font-mono); border:1px solid; border-radius:20px; padding:2px 8px; display:inline-flex; align-items:center; gap:3px; }
  .notes { font-size:12px; color: var(--paper-dim); font-style: italic; }
  .card-actions { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .delete-btn { background:none; border:none; padding:4px; margin-top:2px; color: var(--paper-dim); font-size:14px; }
  .select-check { width:20px; height:20px; min-width:20px; border-radius:5px; border:1.5px solid var(--paper-dim); display:flex; align-items:center; justify-content:center; background:transparent; padding:0; margin-top:2px; font-size:12px; }
  .select-check.checked { background: var(--gold); border-color: var(--gold); color: var(--ink); }
  .contact-btns { display:flex; gap:6px; margin-top:8px; }
  .contact-btn { background:var(--bg-deep); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; color:var(--paper); display:flex; align-items:center; gap:4px; }

  .empty { text-align:center; padding:48px 20px; }
  .empty-icon { width:56px; height:56px; border-radius:50%; border:1.5px dashed var(--gold); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:22px; }
  .empty-title { color: var(--paper); font-family: var(--font-display); font-size:18px; margin:0 0 4px; }
  .empty-text { color: var(--paper-dim); font-size:13px; margin:0; }

  .fab { position:fixed; bottom: calc(88px + env(safe-area-inset-bottom)); right:20px; width:54px; height:54px; border-radius:50%; background: var(--gold); border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(0,0,0,.35); font-size:26px; color: var(--ink); z-index:15; }

  .share-bar { position:fixed; bottom: calc(88px + env(safe-area-inset-bottom) + 10px); left:50%; transform:translateX(-50%); width:calc(100% - 40px); max-width:440px; background:#25D366; color:#0a3d24; border-radius:14px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 6px 16px rgba(0,0,0,.35); z-index:20; border:none; font-weight:600; }
  .share-bar span { font-size:13px; }
  .share-bar-btns { display:flex; align-items:center; gap:6px; }
  .share-bar button.go { background:#0a3d24; color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .share-cancel { background:none !important; color:#0a3d24 !important; padding:6px !important; font-size:18px; border:none; }

  nav.tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; display:flex; background: var(--bg-deep); border-top:1px solid var(--line); padding:10px 20px calc(18px + env(safe-area-inset-bottom)); }
  .tab-btn { flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; position:relative; color: var(--paper-dim); font-size:20px; }
  .tab-btn.active { color: var(--gold); }
  .tab-label { font-size:11px; font-family: var(--font-mono); }
  .tab-dot { position:absolute; top:-10px; width:4px; height:4px; border-radius:50%; background: var(--gold); }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; z-index:50; }
  .sheet { width:100%; max-width:480px; margin:0 auto; background: var(--bg); border-radius:20px 20px 0 0; padding:10px 20px calc(28px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; border-top:1px solid var(--line); }
  .sheet-handle { width:36px; height:4px; border-radius:2px; background: var(--line); margin:6px auto 14px; }
  .sheet-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .sheet-title { color: var(--paper); font-family: var(--font-display); font-size:20px; margin:0; }
  .close-btn { background:none; border:none; padding:4px; color: var(--paper); font-size:20px; }
  .form { display:flex; flex-direction:column; gap:14px; }
  .form-row { display:flex; gap:10px; }
  .form-row .field { flex:1; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field-label { font-size:12px; color: var(--paper-dim); font-family: var(--font-mono); }
  .input, textarea.input { background: var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; color: var(--paper); font-size:15px; width:100%; resize:none; }
  .segmented { display:flex; gap:8px; }
  .segment-btn { flex:1; padding:10px 8px; border-radius:8px; border:1px solid var(--line); font-size:13px; background:transparent; color: var(--paper); }
  .segment-btn.active-prestado { background: var(--green); color: var(--ink); }
  .segment-btn.active-recibido { background: var(--red); color: var(--ink); }
  .save-btn { width:100%; margin-top:22px; padding:14px; border-radius:12px; border:none; background: var(--gold); color: var(--ink); font-weight:600; font-size:15px; }
  .save-btn:disabled { opacity:.4; }
  .error-banner { margin:12px 20px 0; padding:10px 14px; background:rgba(193,80,61,.15); border:1px solid var(--red); border-radius:8px; color: var(--red); font-size:13px; }
  .toast { position:fixed; top: max(16px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%); background: var(--card); border:1px solid var(--gold); color: var(--paper); padding:10px 16px; border-radius:10px; font-size:13px; z-index:60; }

  .venta-card { flex-direction:column; align-items:stretch; gap:10px; }
  .venta-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .venta-title { color: var(--paper); font-size:15px; font-weight:500; }
  .venta-price { color: var(--paper-dim); font-family: var(--font-mono); font-size:12px; margin-top:2px; }
  .venta-stats { display:flex; gap:16px; }
  .venta-stat { display:flex; flex-direction:column; }
  .venta-stat-label { font-size:10px; color: var(--paper-dim); font-family: var(--font-mono); letter-spacing:.05em; }
  .venta-stat-value { font-size:18px; font-family: var(--font-mono); font-weight:600; color: var(--gold); }
  .venta-stat-value.income { color: var(--green); font-size:15px; }
  .venta-controls { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .stepper { display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .stepper button { background: var(--card); border:none; color: var(--paper); width:40px; height:38px; font-size:18px; }
  .stepper button:active { background: var(--line); }
  .stepper button.plus { color: var(--green); }
  .stepper button.minus { color: var(--red); }
  .venta-mini-actions { display:flex; gap:8px; }
  .mini-btn { background:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:11px; color: var(--paper-dim); font-family: var(--font-mono); }

  .settings-section { margin-bottom:20px; }
  .settings-section-title { font-size:12px; color: var(--gold); font-family: var(--font-mono); letter-spacing:.08em; margin-bottom:10px; }
  .settings-btn { width:100%; text-align:left; background: var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; color: var(--paper); font-size:14px; display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .libreta-item { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; }
  .libreta-item.active { border-color:var(--gold); }
  .libreta-item-name { font-size:14px; color: var(--paper); background:none; border:none; text-align:left; flex:1; }
  .libreta-item.active .libreta-item-name { color: var(--gold); font-weight:600; }
  .libreta-del { background:none; border:none; color: var(--paper-dim); font-size:14px; padding:6px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- Almacenamiento local (en este teléfono) ----------
const DB_KEY = "libreta_data_v3";

function nuevaLibreta(nombre) {
  return { id: uid(), nombre: nombre || "Mi Libreta", productos: [], prestamos: [], ventas: [] };
}

function loadData() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.libretas && parsed.libretas.length) return parsed;
    }
    // migración desde v2 (una sola libreta sin estructura de libretas)
    const v2 = localStorage.getItem("libreta_data_v2");
    if (v2) {
      const o = JSON.parse(v2);
      const lib = nuevaLibreta("Mi Libreta");
      lib.productos = (o.productos || []).map(p => ({ ...p, categoria: p.categoria || "" }));
      lib.prestamos = (o.prestamos || []).map(p => ({ ...p, telefono: p.telefono || "", fechaLimite: p.fechaLimite || "" }));
      lib.ventas = o.ventas || [];
      return { libretas: [lib], activeLibretaId: lib.id };
    }
    // migración desde v1 (más antigua aún)
    const v1 = localStorage.getItem("libreta_data_v1");
    if (v1) {
      const o = JSON.parse(v1);
      const lib = nuevaLibreta("Mi Libreta");
      lib.productos = (o.productos || []).map(p => ({
        id: p.id, nombre: p.nombre, cantidad: 1, precio: p.precio,
        descripcion: p.notas || "", categoria: "", comprado: !!p.comprado
      }));
      lib.prestamos = (o.prestamos || []).map(p => ({ ...p, telefono: "", fechaLimite: "" }));
      return { libretas: [lib], activeLibretaId: lib.id };
    }
    const lib = nuevaLibreta("Mi Libreta");
    return { libretas: [lib], activeLibretaId: lib.id };
  } catch (e) {
    const lib = nuevaLibreta("Mi Libreta");
    return { libretas: [lib], activeLibretaId: lib.id };
  }
}
function saveData(data) {
  try { localStorage.setItem(DB_KEY, JSON.stringify(data)); }
  catch (e) { showError("No se pudo guardar. Espacio lleno o navegador privado."); }
}

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

let appData = loadData();
function activeLibreta() {
  return appData.libretas.find(l => l.id === appData.activeLibretaId) || appData.libretas[0];
}

let currentTab = "productos";
let errorMsg = "";
let selectedIds = new Set();
let searchQuery = "";
let showSearch = false;
let editingId = null;
let selectedCategoria = "Todas";
let showSettings = false;
let showLibretaSwitcher = false;

function fmt(n) { return new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: 2 }).format(Number(n) || 0); }
function showError(msg) { errorMsg = msg; render(); setTimeout(() => { errorMsg = ""; render(); }, 4000); }
function showToast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.innerText = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}
function escapeHtml(s) { const d = document.createElement("div"); d.innerText = s || ""; return d.innerHTML; }

function diasDesde(fechaStr) {
  if (!fechaStr) return "";
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const f = new Date(fechaStr + "T00:00:00");
  const diff = Math.round((hoy - f) / 86400000);
  if (diff === 0) return "hoy";
  if (diff === 1) return "hace 1 día";
  if (diff > 1) return `hace ${diff} días`;
  if (diff === -1) return "mañana";
  return `en ${Math.abs(diff)} días`;
}
function estaVencido(fechaLimite, pagado) {
  if (!fechaLimite || pagado) return false;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const f = new Date(fechaLimite + "T00:00:00");
  return f < hoy;
}

function render() {
  const lib = activeLibreta();
  let productos = lib.productos;
  let prestamos = lib.prestamos;
  let ventas = lib.ventas;

  if (showSearch && searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    if (currentTab === "productos") {
      productos = productos.filter(p => (p.nombre||"").toLowerCase().includes(q) || (p.descripcion||"").toLowerCase().includes(q) || (p.categoria||"").toLowerCase().includes(q));
    } else if (currentTab === "prestamos") {
      prestamos = prestamos.filter(p => (p.persona||"").toLowerCase().includes(q) || (p.descripcion||"").toLowerCase().includes(q));
    } else if (currentTab === "ventas") {
      ventas = ventas.filter(v => (v.nombre||"").toLowerCase().includes(q));
    }
  }

  const categorias = ["Todas", ...Array.from(new Set(lib.productos.map(p => p.categoria).filter(Boolean)))];
  if (currentTab === "productos" && selectedCategoria !== "Todas") {
    productos = productos.filter(p => (p.categoria || "Sin categoría") === selectedCategoria);
  }

  const totalWishlist = lib.productos.reduce((s, p) => p.comprado ? s : s + Number(p.precio || 0) * Number(p.cantidad || 1), 0);
  const meDeben = lib.prestamos.filter(p => p.tipo === "prestado" && !p.pagado).reduce((s, p) => s + Number(p.monto || 0), 0);
  const debo = lib.prestamos.filter(p => p.tipo === "recibido" && !p.pagado).reduce((s, p) => s + Number(p.monto || 0), 0);
  const saldo = meDeben - debo;
  const totalUnidadesVendidas = lib.ventas.reduce((s, v) => s + Number(v.vendidos || 0), 0);
  const totalIngresos = lib.ventas.reduce((s, v) => s + Number(v.vendidos || 0) * Number(v.precio || 0), 0);

  let listHtml = "";
  if (currentTab === "ventas") {
    if (ventas.length === 0) {
      listHtml = lib.ventas.length === 0
        ? emptyState("📈", "Sin productos en venta", "Agrega un producto y lleva la cuenta de cuántos vas vendiendo.")
        : emptyState("🔍", "Sin resultados", "No hay coincidencias con tu búsqueda.");
    } else {
      const sorted = [...ventas].sort((a, b) => (a.nombre || "").localeCompare(b.nombre || ""));
      listHtml = `<ul class="list">${sorted.map(ventaCard).join("")}</ul>`;
    }
  } else if (currentTab === "productos") {
    if (productos.length === 0) {
      listHtml = lib.productos.length === 0
        ? emptyState("🛍️", "Sin productos", "Anota lo que quieres comprar: nombre, cantidad, precio, categoría y descripción.")
        : emptyState("🔍", "Sin resultados", "No hay productos que coincidan.");
    } else {
      const sorted = [...productos].sort((a, b) => Number(a.comprado) - Number(b.comprado));
      listHtml = `<ul class="list">${sorted.map(productoCard).join("")}</ul>`;
    }
  } else {
    if (prestamos.length === 0) {
      listHtml = lib.prestamos.length === 0
        ? emptyState("🤝", "Sin préstamos ni fiados", "Registra dinero o cosas fiadas, con quién, teléfono y fecha límite.")
        : emptyState("🔍", "Sin resultados", "No hay coincidencias con tu búsqueda.");
    } else {
      const sorted = [...prestamos].sort((a, b) => {
        if (Number(a.pagado) !== Number(b.pagado)) return Number(a.pagado) - Number(b.pagado);
        return (b.fecha || "").localeCompare(a.fecha || "");
      });
      listHtml = `<ul class="list">${sorted.map(prestamoCard).join("")}</ul>`;
    }
  }

  let summaryLeft;
  if (currentTab === "productos") {
    summaryLeft = `${lib.productos.filter(p => !p.comprado).length} pendientes · <span class="mono">${fmt(totalWishlist)}</span>`;
  } else if (currentTab === "ventas") {
    summaryLeft = `<span class="mono" style="color:var(--gold)">${totalUnidadesVendidas}</span> unidades vendidas · <span class="mono" style="color:var(--green)">${fmt(totalIngresos)}</span> ingresos`;
  } else {
    summaryLeft = `<span class="mono" style="color:var(--green)">${fmt(meDeben)}</span> me deben · <span class="mono" style="color:var(--red)">${fmt(debo)}</span> debo`;
  }

  const toolbarHtml = `
    <div class="toolbar">
      ${showSearch ? `<input class="search-input" id="search-input" placeholder="Buscar..." value="${escapeHtml(searchQuery)}" oninput="onSearch(this.value)" autofocus />` : `<div style="flex:1"></div>`}
      <button class="icon-btn ${showSearch ? 'active' : ''}" onclick="toggleSearch()" aria-label="Buscar">🔍</button>
      ${currentTab === 'productos' ? `<button class="icon-btn" onclick="shareAll()" aria-label="Compartir toda la lista">📤</button>` : ""}
    </div>`;

  const chipsHtml = (currentTab === "productos" && categorias.length > 1) ? `
    <div class="chip-row">
      ${categorias.map(c => `<button class="chip ${selectedCategoria === c ? 'active' : ''}" onclick="setCategoria('${escapeHtml(c).replace(/'/g,"\\'")}')">${escapeHtml(c)}</button>`).join("")}
    </div>` : "";

  document.getElementById("app").innerHTML = `
    <header>
      <button class="header-title-btn" onclick="openLibretaSwitcher()">

function emptyState(icon, title, text) {
  return `<div class="empty"><div class="empty-icon">${icon}</div><p class="empty-title">${title}</p><p class="empty-text">${text}</p></div>`;
}

      <div class="card-body">
        <div class="card-top">

        <div class="card-sub">${cantidad} × ${fmt(p.precio)}</div>
        <div class="card-meta">

function prestamoCard(p) {

  const vencido = estaVencido(p.fechaLimite, p.pagado);

  return `
    <li class="card ${p.pagado ? 'done' : ''} ${vencido ? 'vencido' : ''}">

function ventaCard(v) {
  const vendidos = Number(v.vendidos || 0);
  const ingreso = vendidos * Number(v.precio || 0);

      <div class="venta-top">

// ---------- Confirmación personalizada ----------
let confirmCallback = null;
function askConfirm(message, callback) {
  confirmCallback = callback;
  document.getElementById("sheet-container").innerHTML = `
    <div class="overlay" onclick="cancelConfirm()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <p style="color:var(--paper); font-size:15px; margin:10px 4px 22px; text-align:center; line-height:1.5;">${escapeHtml(message)}</p>
        <div style="display:flex; gap:10px;">
          <button class="segment-btn" style="flex:1;" onclick="cancelConfirm()">Cancelar</button>
          <button class="segment-btn" style="flex:1; background:var(--red); color:var(--ink); border-color:var(--red);" onclick="confirmYes()">Eliminar</button>
        </div>
      </div>
    </div>`;
}
function cancelConfirm() { confirmCallback = null; document.getElementById("sheet-container").innerHTML = ""; }
function confirmYes() {
  const cb = confirmCallback;
  confirmCallback = null;
  document.getElementById("sheet-container").innerHTML = "";
  if (cb) cb();
}

function setTab(tab) { currentTab = tab; selectedIds.clear(); showSearch = false; searchQuery = ""; selectedCategoria = "Todas"; render(); }
function toggleSearch() { showSearch = !showSearch; if (!showSearch) searchQuery = ""; render(); }
function onSearch(v) { searchQuery = v; render(); }
function setCategoria(c) { selectedCategoria = c; render(); }

function toggleProducto(id) {
  const lib = activeLibreta();
  lib.productos = lib.productos.map(p => p.id === id ? { ...p, comprado: !p.comprado } : p);
  saveData(appData); render();
}
function deleteProducto(id) {
  askConfirm("¿Seguro que quieres eliminar este producto? No se puede deshacer.", () => {
    const lib = activeLibreta();
    selectedIds.delete(id);
    lib.productos = lib.productos.filter(p => p.id !== id);
    saveData(appData); render();
  });
}
function editProducto(id) {
  const lib = activeLibreta();
  const p = lib.productos.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  openForm(p);
}
function togglePrestamo(id) {
  const lib = activeLibreta();
  lib.prestamos = lib.prestamos.map(p => p.id === id ? { ...p, pagado: !p.pagado } : p);
  saveData(appData); render();
}
function deletePrestamo(id) {
  askConfirm("¿Seguro que quieres eliminar este registro? No se puede deshacer.", () => {
    const lib = activeLibreta();
    lib.prestamos = lib.prestamos.filter(p => p.id !== id);
    saveData(appData); render();
  });
}
function editPrestamo(id) {
  const lib = activeLibreta();
  const p = lib.prestamos.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  openForm(p);
}

function toggleSelect(id) {
  if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  render();
}
function clearSelection() { selectedIds.clear(); render(); }

function buildListText(items) {
  const lines = items.map(p => `• ${p.nombre} (x${Number(p.cantidad || 1)})`);
  return `🛍️ Mi lista de compras:\n\n${lines.join("\n")}`;
}
function shareSelected() {
  const lib = activeLibreta();
  const items = lib.productos.filter(p => selectedIds.has(p.id));
  if (items.length === 0) return;
  window.open("https://wa.me/?text=" + encodeURIComponent(buildListText(items)), "_blank");
}
function shareAll() {
  const lib = activeLibreta();
  const items = lib.productos.filter(p => !p.comprado);
  if (items.length === 0) { showToast("No hay productos pendientes para compartir"); return; }
  window.open("https://wa.me/?text=" + encodeURIComponent(buildListText(items)), "_blank");
}

function incVenta(id, delta) {
  const lib = activeLibreta();
  lib.ventas = lib.ventas.map(v => v.id === id ? { ...v, vendidos: Math.max(0, Number(v.vendidos || 0) + delta) } : v);
  saveData(appData); render();
}
function resetVenta(id) {
  const lib = activeLibreta();
  lib.ventas = lib.ventas.map(v => v.id === id ? { ...v, vendidos: 0 } : v);
  saveData(appData); render();
}
function deleteVenta(id) {
  askConfirm("¿Seguro que quieres eliminar este producto de ventas? No se puede deshacer.", () => {
    const lib = activeLibreta();
    lib.ventas = lib.ventas.filter(v => v.id !== id);
    saveData(appData); render();
  });
}

// ---------- Formulario de agregar/editar ----------
let formTipo = "prestado";

function openForm(prefill) {
  formTipo = (prefill && prefill.tipo) || "prestado";
  const isProductos = currentTab === "productos";
  const isVentas = currentTab === "ventas";
  const today = new Date().toISOString().slice(0, 10);

      <input class="input" id="f-nombre" placeholder="Ej. Audífonos" value="${prefill ? escapeHtml(prefill.nombre) : ''}" /></div>
    <div class="form-row">

        <option value="Hogar"></option>
        <option value="Tecnología"></option>
        <option value="Salud"></option>
        <option value="Otro"></option>
      </datalist>
    </div>
    <div class="field"><span class="field-label">Descripción (opcional)</span>
      <textarea class="input" id="f-descripcion" rows="2" placeholder="Ej. Color negro, talla M...">${prefill ? escapeHtml(prefill.descripcion || '') : ''}</textarea></div>
  `;

  const prestamoForm = `
    <div class="field"><span class="field-label">Tipo</span>
      <div class="segmented" id="f-tipo-group">
        <button type="button" class="segment-btn ${formTipo === 'prestado' ? 'active-prestado' : ''}" data-id="prestado" onclick="selectTipo('prestado')">Yo presté / fié</button>

    <div class="field"><span class="field-label" id="f-persona-label">${formTipo === 'recibido' ? '¿Quién te prestó/fió?' : '¿A quién?'}</span>
      <input class="input" id="f-persona" placeholder="Nombre" value="${prefill ? escapeHtml(prefill.persona) : ''}" /></div>
    <div class="field"><span class="field-label">Teléfono (opcional)</span>
      <input class="input" id="f-telefono" type="tel" placeholder="Ej. 5512345678" value="${prefill ? escapeHtml(prefill.telefono || '') : ''}" /></div>
    <div class="form-row">
      <div class="field"><span class="field-label">Monto</span>
        <input class="input" id="f-monto" type="number" inputmode="decimal" placeholder="0.00" value="${prefill ? prefill.monto : ''}" /></div>
      <div class="field"><span class="field-label">Fecha</span>
        <input class="input" id="f-fecha" type="date" value="${prefill ? prefill.fecha : today}" /></div>
    </div>
    <div class="field"><span class="field-label">Fecha límite de cobro (opcional)</span>
      <input class="input" id="f-fecha-limite" type="date" value="${prefill ? (prefill.fechaLimite || '') : ''}" /></div>
    <div class="field"><span class="field-label">Descripción (opcional)</span>
      <textarea class="input" id="f-descripcion" rows="2" placeholder="Ej. Para gasolina, motivo del préstamo...">${prefill ? escapeHtml(prefill.descripcion || '') : ''}</textarea></div>
  `;

  const ventaForm = `
    <div class="field"><span class="field-label">Nombre del producto</span>
      <input class="input" id="f-nombre" placeholder="Ej. Tacos, playeras, cortes..." /></div>
    <div class="form-row">
      <div class="field"><span class="field-label">Precio por unidad</span>
        <input class="input" id="f-precio" type="number" inputmode="decimal" placeholder="0.00" /></div>
      <div class="field"><span class="field-label">Vendidos hasta ahora</span>
        <input class="input" id="f-vendidos" type="number" inputmode="numeric" min="0" value="0" /></div>
    </div>

  let title, formHtml;
  if (isVentas) { title = "Nuevo producto en venta"; formHtml = ventaForm; }
  else if (isProductos) { title = editingId ? "Editar producto" : "Nuevo producto"; formHtml = productoForm; }
  else { title = editingId ? "Editar préstamo / fiado" : "Nuevo préstamo / fiado"; formHtml = prestamoForm; }

  document.getElementById("sheet-container").innerHTML = `
    <div class="overlay" onclick="closeForm(event)">

function selectTipo(id) {
  formTipo = id;
  document.querySelectorAll("#f-tipo-group .segment-btn").forEach(b => {
    b.className = "segment-btn" + (b.dataset.id === id ? " active-" + id : "");
  });
  document.getElementById("f-persona-label").innerText = id === "prestado" ? "¿A quién?" : "¿Quién te prestó/fió?";
}

function closeForm(e) { if (e) e.stopPropagation(); editingId = null; document.getElementById("sheet-container").innerHTML = ""; }

function saveForm() {
  const lib = activeLibreta();
  if (currentTab === "ventas") {
    const nombre = document.getElementById("f-nombre").value.trim();
    const precio = document.getElementById("f-precio").value;
    const vendidos = document.getElementById("f-vendidos").value || "0";
    if (!nombre || !precio) return;
    lib.ventas.push({ id: uid(), nombre, precio: Number(precio), vendidos: Number(vendidos) });
  } else if (currentTab === "productos") {
    const nombre = document.getElementById("f-nombre").value.trim();
    const cantidad = document.getElementById("f-cantidad").value || "1";
    const precio = document.getElementById("f-precio").value;
    const categoria = document.getElementById("f-categoria").value.trim();
    const descripcion = document.getElementById("f-descripcion").value.trim();
    if (!nombre || !precio) return;
    if (editingId) {
      lib.productos = lib.productos.map(p => p.id === editingId
        ? { ...p, nombre, cantidad: Number(cantidad), precio: Number(precio), categoria, descripcion }
        : p);
      editingId = null;
    } else {
      lib.productos.push({ id: uid(), nombre, cantidad: Number(cantidad), precio: Number(precio), categoria, descripcion, comprado: false });
    }
  } else {
    const persona = document.getElementById("f-persona").value.trim();
    const telefono = document.getElementById("f-telefono").value.trim();
    const monto = document.getElementById("f-monto").value;
    const fecha = document.getElementById("f-fecha").value;
    const fechaLimite = document.getElementById("f-fecha-limite").value;
    const descripcion = document.getElementById("f-descripcion").value.trim();
    if (!persona || !monto) return;
    if (editingId) {
      lib.prestamos = lib.prestamos.map(p => p.id === editingId
        ? { ...p, persona, telefono, monto: Number(monto), tipo: formTipo, fecha, fechaLimite, descripcion }
        : p);
      editingId = null;
    } else {
      lib.prestamos.push({ id: uid(), persona, telefono, monto: Number(monto), tipo: formTipo, fecha, fechaLimite, descripcion, pagado: false });
    }
  }
  saveData(appData);
  closeForm();
  render();
}

// ---------- Ajustes: exportar / importar / renombrar ----------
function openSettings() { showSettings = true; showLibretaSwitcher = false; render(); }
function closeSettings() { showSettings = false; render(); }

function renderSettings() {
  const lib = activeLibreta();
  const html = `
    <div class="overlay" onclick="closeSettings()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h2 class="sheet-title">Ajustes</h2>
          <button class="close-btn" onclick="closeSettings()">✕</button>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">LIBRETA ACTUAL</div>
          <div class="field">
            <input class="input" id="settings-nombre-libreta" value="${escapeHtml(lib.nombre)}" />
          </div>
          <button class="save-btn" style="margin-top:10px;" onclick="renombrarLibreta()">Guardar nombre</button>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">COPIA DE SEGURIDAD</div>
          <button class="settings-btn" onclick="exportData()">⬇️ Exportar todos mis datos</button>
          <button class="settings-btn" onclick="document.getElementById('import-file-input').click()">⬆️ Importar datos desde archivo</button>
          <input type="file" id="import-file-input" accept="application/json" style="display:none" onchange="handleImportFile(this)" />
        </div>
      </div>
    </div>
  `;
  document.getElementById("sheet-container").innerHTML = html;
}

function renombrarLibreta() {
  const lib = activeLibreta();
  const val = document.getElementById("settings-nombre-libreta").value.trim();
  if (!val) return;
  lib.nombre = val;
  saveData(appData);
  showToast("Nombre actualizado");
  closeSettings();
}

function exportData() {
  const dataStr = JSON.stringify(appData, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const today = new Date().toISOString().slice(0, 10);
  a.href = url; a.download = `mi-libreta-backup-${today}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast("Descargando copia de seguridad...");
}

function handleImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.libretas || !Array.isArray(parsed.libretas) || parsed.libretas.length === 0) {
        throw new Error("formato inválido");
      }
      if (!window.confirm("Esto reemplazará TODOS tus datos actuales por los del archivo. ¿Quieres continuar?")) return;
      appData = parsed;
      if (!appData.activeLibretaId || !appData.libretas.find(l => l.id === appData.activeLibretaId)) {
        appData.activeLibretaId = appData.libretas[0].id;
      }
      saveData(appData);
      closeSettings();
      showToast("Datos importados correctamente");
      render();
    } catch (err) {
      showError("El archivo no es válido para importar.");
    }
  };
  reader.readAsText(file);
  input.value = "";
}

// ---------- Múltiples libretas ----------
function openLibretaSwitcher() { showLibretaSwitcher = true; showSettings = false; render(); }
function closeLibretaSwitcher() { showLibretaSwitcher = false; render(); }

function renderLibretaSwitcher() {
  const itemsHtml = appData.libretas.map(l => `
    <div class="libreta-item ${l.id === appData.activeLibretaId ? 'active' : ''}">
      <button class="libreta-item-name" onclick="switchLibreta('${l.id}')">${escapeHtml(l.nombre)}</button>
      ${appData.libretas.length > 1 ? `<button class="libreta-del" onclick="eliminarLibreta('${l.id}')" aria-label="Eliminar libreta">🗑</button>` : ""}
    </div>
  `).join("");

  const html = `
    <div class="overlay" onclick="closeLibretaSwitcher()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h2 class="sheet-title">Mis libretas</h2>
          <button class="close-btn" onclick="closeLibretaSwitcher()">✕</button>
        </div>
        ${itemsHtml}
        <div class="field" style="margin-top:14px;">
          <span class="field-label">Nueva libreta</span>
          <input class="input" id="nueva-libreta-nombre" placeholder="Ej. Mi negocio, Gastos personales..." />
        </div>
        <button class="save-btn" onclick="crearLibreta()">+ Crear libreta</button>
      </div>
    </div>
  `;
  document.getElementById("sheet-container").innerHTML = html;
}

function switchLibreta(id) {
  appData.activeLibretaId = id;
  selectedIds.clear(); searchQuery = ""; showSearch = false; selectedCategoria = "Todas";
  saveData(appData);
  closeLibretaSwitcher();
  showToast("Libreta cambiada");
}

function crearLibreta() {
  const nombre = document.getElementById("nueva-libreta-nombre").value.trim();
  if (!nombre) return;
  const lib = nuevaLibreta(nombre);
  appData.libretas.push(lib);
  appData.activeLibretaId = lib.id;
  saveData(appData);
  closeLibretaSwitcher();
  showToast("Libreta creada");
}

function eliminarLibreta(id) {
  if (appData.libretas.length <= 1) return;
  const lib = appData.libretas.find(l => l.id === id);
  askConfirm(`¿Eliminar la libreta "${lib.nombre}" y todo lo que tiene guardado? Esto no se puede deshacer.`, () => {
    appData.libretas = appData.libretas.filter(l => l.id !== id);
    if (appData.activeLibretaId === id) appData.activeLibretaId = appData.libretas[0].id;
    saveData(appData);
    renderLibretaSwitcher();
    showToast("Libreta eliminada");
  });
}

render();

// ---------- Registro del service worker ----------
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
